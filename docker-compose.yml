name: reto-tecnico

services:
  node-api:
    build:
      context: ./node-api
    image: reto-tecnico/node-api:latest
    environment:
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en tu archivo .env}
      JWT_ISSUER: ${JWT_ISSUER:-reto-tecnico}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      AUTH_USERS: ${AUTH_USERS:-admin:admin123,analista:analista123}
    ports:
      - "${NODE_API_PORT:-3000}:3000"
    restart: unless-stopped

  go-api:
    build:
      context: ./go-api
    image: reto-tecnico/go-api:latest
    environment:
      HTTP_ADDR: ":8080"
      NODE_API_URL: http://node-api:3000
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en tu archivo .env}
      JWT_ISSUER: ${JWT_ISSUER:-reto-tecnico}
      MAX_MATRIX_DIM: ${MAX_MATRIX_DIM:-200}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-5s}
    ports:
      - "${GO_API_PORT:-8080}:8080"
    depends_on:
      node-api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: reto-tecnico/frontend:latest
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - go-api
      - node-api
    restart: unless-stopped
