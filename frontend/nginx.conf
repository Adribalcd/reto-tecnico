server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El navegador habla con las dos APIs a través de este proxy, así todo
    # queda en el mismo origen y no hace falta CORS en producción.
    location /go/ {
        proxy_pass http://go-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /node/ {
        proxy_pass http://node-api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
